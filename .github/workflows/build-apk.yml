name: Build MATCHLY debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack uploaded project ZIP (first run only)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ZIP="$(ls MATCHLY*.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo "No MATCHLY zip found - building the sources already in the repo."
            exit 0
          fi
          echo "Unpacking $ZIP"
          mkdir -p "$RUNNER_TEMP/unpack"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/unpack"
          SETTINGS="$(find "$RUNNER_TEMP/unpack" -name settings.gradle.kts | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found inside $ZIP"
            exit 1
          fi
          SRC="$(dirname "$SETTINGS")"
          (cd "$SRC" && tar cf - --exclude=./.github --exclude=./.git .) | tar xf -
          rm -f "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add MATCHLY project sources (unpacked from ZIP)" || true
          git push origin "HEAD:${BRANCH}" || echo "::warning::Could not push the unpacked sources; continuing with this build only."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          MATCHLY_BACKEND_URL: ${{ vars.MATCHLY_BACKEND_URL }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATCHLY-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
