# MATCHLY build-time configuration (PLACEHOLDERS ONLY - never put a sports-API key here).
#
# MATCHLY_BACKEND_URL = the public https address of YOUR MATCHLY backend proxy,
# for example  https://matchly-api.onrender.com
# This address is not a secret. Leave it empty to build in labelled DEMO mode.
# You can also type the address inside the app (Settings > Data source) without rebuilding.
#
# MATCHLY_APP_TOKEN = optional shared token that your backend checks (header x-matchly-token).
# It is embedded in the APK, so it only deters casual abuse - it is NOT a secret.
MATCHLY_BACKEND_URL=
MATCHLY_APP_TOKEN=
